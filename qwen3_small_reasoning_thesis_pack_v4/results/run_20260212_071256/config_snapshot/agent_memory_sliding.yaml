# Edge-Reasoning Agent ablation: memory_sliding
model:
  backend: "local"
  name_or_path: "qwen3:8b"
  thinking:
    enable: true
    soft_switch:
      think: "/think"
      no_think: "/no_think"
  decoding:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    max_new_tokens: 512

local_backend:
  provider: "ollama"
  base_url: "http://localhost:11434/v1"
  request_timeout_s: 120
  use_mock_if_unavailable: true

fallback:
  enable: true
  mode: "heuristic"

retrieval:
  embedding_model: "sentence-transformers"
  index: "faiss"
  chunk_size: 512
  chunk_overlap: 128
  top_k_init: 3
  top_k_iter: 1
  cache:
    embedding_cache: true
    retrieval_cache: false

agent:
  max_steps: 6
  max_prompt_tokens: 8000
  memory_strategy: "sliding_window"
  facts_per_step: 6
  format_repair:
    enable: true
    max_retries: 1
  uncertainty_trigger:
    enable: true
    patterns: ["不确定", "需要查证", "缺少信息"]
  injection_defense:
    enable: true
    strip_patterns:
      - "忽略以上"
      - "忽略之前"
      - "系统提示"
      - "你现在是"
    quote_chunks: true
    label_as_evidence: true

logging:
  log_dir: "results/logs"
  nvml_sample_ms: 200
  save_trace: true
