# Edge-Reasoning Agent config (v4)
model:
  backend: "local"                 # local|hf
  name_or_path: "qwen3:8b"         # local: ollama model name; hf: Qwen/Qwen3-8B
  thinking:
    enable: true
    soft_switch:
      think: "/think"
      no_think: "/no_think"
  decoding:
    temperature: 0.35
    top_p: 0.90
    top_k: 20
    max_new_tokens: 272

local_backend:
  provider: "ollama"               # ollama|llama_cpp_server
  base_url: "http://localhost:11434/v1"
  request_timeout_s: 180
  use_mock_if_unavailable: true

fallback:
  enable: true
  mode: "heuristic"

retrieval:
  embedding_model: "sentence-transformers"   # or Qwen/Qwen3-Embedding-0.6B
  index: "faiss"
  sample_index: "faiss"
  require_dense_in_formal: true
  hybrid:
    enable: true
    alpha_dense: 0.65
    alpha_lexical: 0.35
    max_candidates: 20
    dedup_by_chunk_id: true
  chunk_size: 512
  chunk_overlap: 128
  top_k_init: 2
  top_k_iter: 1
  cache:
    embedding_cache: true
    retrieval_cache: false

agent:
  max_steps: 3
  max_prompt_tokens: 8000
  memory_strategy: "fact_memory"   # sliding_window|fact_memory
  facts_per_step: 6

  # Early-stop controls for balancing quality and latency.
  early_stop:
    enable: true
    max_same_keyword_hits: 3
    max_no_new_chunk_steps: 2
    enable_single_doc_shortcut: true
    single_doc_max_steps: 3
    enable_query_rewrite_retry: false

  # Output protocol enforcement
  format_repair:
    enable: true
    max_retries: 2

  decoding_budget:
    enable: true
    short_question_token_threshold: 12
    short_question_max_new_tokens: 176
    default_max_new_tokens: 256
    task_caps:
      code_qa: 176
      multi_doc_qa: 200
      single_doc_qa: 176

  task_overrides:
    code_qa:
      top_k_init: 3
      max_steps: 3
      max_new_tokens: 192
      temperature: 0.2
      low_confidence:
        enable: true
        min_answer_chars: 20
        uncertainty_markers:
          - "not sure"
          - "maybe"
          - "unknown"
          - "todo"
        truncated_tail_markers:
          - "and"
          - "or"
          - ","
          - ":"
          - ";"
      forced_retrieve:
        enable: true
        max_extra_searches: 1
        top_k_extra: 1
    multi_doc_qa:
      top_k_init: 3
      top_k_iter: 1
      max_steps: 3
      max_new_tokens: 208
      enable_query_rewrite_retry: true
      temperature: 0.25
      low_confidence:
        enable: true
        min_answer_chars: 28
        uncertainty_markers:
          - "maybe"
          - "not sure"
          - "unclear"
          - "need to verify"
        truncated_tail_markers:
          - "and"
          - "or"
          - ","
          - ":"
          - ";"
      forced_retrieve:
        enable: true
        max_extra_searches: 1
        top_k_extra: 1
        force_on_first_final: true
    single_doc_qa:
      top_k_init: 3
      enable_final_refine: true
      final_refine_max_new_tokens: 128
      final_refine_temperature: 0.15
      low_confidence:
        enable: true
        min_answer_chars: 20
        uncertainty_markers:
          - "wait"
          - "maybe"
          - "however"
          - "not sure"
          - "我不确定"
          - "可能"
        truncated_tail_markers:
          - "which"
          - "that"
          - "and"
          - "or"
          - ","
          - ":"
          - ";"
      forced_retrieve:
        enable: true
        max_extra_searches: 1
        top_k_extra: 1
      long_context:
        enable: true
        threshold_chars: 80000
        top_k_init: 4
        max_steps: 4
        enable_single_doc_shortcut: false

  # Meta-cognitive retrieval trigger (optional)
  uncertainty_trigger:
    enable: true
    patterns: ["不确定","需要查证","缺少信息"]

  # Prompt injection defense for retrieved chunks
  injection_defense:
    enable: true
    strip_patterns:
      - "忽略以上"
      - "忽略之前"
      - "系统提示"
      - "你现在是"
    quote_chunks: true           # wrap chunks in quotes / code fences
    label_as_evidence: true      # add "【Evidence】" prefixes

logging:
  log_dir: "results/logs"
  nvml_sample_ms: 200
  save_trace: true
