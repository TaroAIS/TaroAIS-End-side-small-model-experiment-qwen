# Edge-Reasoning Agent config (v4)
model:
  backend: "local"                 # local|hf
  name_or_path: "qwen3:8b"         # local: ollama model name; hf: Qwen/Qwen3-8B
  thinking:
    enable: true
    soft_switch:
      think: "/think"
      no_think: "/no_think"
  decoding:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    max_new_tokens: 512

local_backend:
  provider: "ollama"               # ollama|llama_cpp_server
  base_url: "http://localhost:11434/v1"
  request_timeout_s: 120
  use_mock_if_unavailable: true

fallback:
  enable: true
  mode: "heuristic"

retrieval:
  embedding_model: "sentence-transformers"   # or Qwen/Qwen3-Embedding-0.6B
  index: "faiss"
  sample_index: "lexical"
  chunk_size: 512
  chunk_overlap: 128
  top_k_init: 3
  top_k_iter: 1
  cache:
    embedding_cache: true
    retrieval_cache: false

agent:
  max_steps: 6
  max_prompt_tokens: 8000
  memory_strategy: "fact_memory"   # sliding_window|fact_memory
  facts_per_step: 6

  # Output protocol enforcement
  format_repair:
    enable: true
    max_retries: 1

  # Meta-cognitive retrieval trigger (optional)
  uncertainty_trigger:
    enable: true
    patterns: ["不确定","需要查证","缺少信息"]

  # Prompt injection defense for retrieved chunks
  injection_defense:
    enable: true
    strip_patterns:
      - "忽略以上"
      - "忽略之前"
      - "系统提示"
      - "你现在是"
    quote_chunks: true           # wrap chunks in quotes / code fences
    label_as_evidence: true      # add "【Evidence】" prefixes

logging:
  log_dir: "results/logs"
  nvml_sample_ms: 200
  save_trace: true
